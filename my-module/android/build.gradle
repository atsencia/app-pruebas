plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nativemap'
version = '0.1.0'

android {
  namespace "expo.modules.nativemap"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'org.osmdroid:osmdroid-android:6.1.18'
}